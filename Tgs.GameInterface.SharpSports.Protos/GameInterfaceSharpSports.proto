syntax = "proto3";

import "phoenix/protobuf/decimal.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Tgs.GameInterface.SharpSports.Protos";

package GameInterfaceSharpSports;

service GameInterfaceSharpSports {
  rpc PlayerBalance (PlayerBalanceRequest) returns (PlayerBalanceReply);
  rpc FundOut(FundRequest) returns (FundReply);
  rpc FundIn (FundRequest) returns (FundReply);
  rpc FundStatus(FundStatusRequest) returns (BaseReply);
  rpc GameUrl (GameUrlRequest) returns (GameUrlReply);
  rpc GameRecordSettlement (GameRecordRequest) returns (GameRecordReply);
  rpc GameRecordUnsettlement (GameRecordRequest) returns (GameRecordReply);
  rpc CheckingService(CheckingServiceRequest) returns (CheckingServiceReply);
}

message PlayerBalanceRequest {
  string api_url = 1;
  string merchant_id = 2;
  string client_id = 3;
  string client_secret = 4;
  string player_code = 5;
}

message FundRequest {
  string api_url = 1;
  string merchant_id = 2;
  string client_id = 3;
  string client_secret = 4;
  string player_code = 5;
  string order_id = 6;
  phoenix.protobuf.DecimalValue amount = 7;
}

message FundStatusRequest {
  string api_url = 1;
  string merchant_id = 2;
  string client_id = 3;
  string client_secret = 4;
  string player_code = 5;
  google.protobuf.Timestamp order_on = 6;
  string order_id = 7;
}

message GameUrlRequest {
  string api_url = 1;
  string merchant_id = 2;
  string client_id = 3;
  string client_secret = 4;
  string player_code = 5;
  bool is_mobile = 6;
  string language = 7;
  string ip = 8;
}

message GameRecordRequest {
  string api_url = 1;
  string merchant_id = 2;
  string client_id = 3;
  string client_secret = 4;
  google.protobuf.Timestamp start_time = 5; 
  google.protobuf.Timestamp end_time = 6;
  int32 page = 7;
  int32 page_size = 8;
}

message CheckingServiceRequest{
  string machine_name = 1;
}

message BaseReply{
  bool status = 1;
}

message PlayerBalanceReply {
	bool is_player_exist = 1;
	phoenix.protobuf.DecimalValue balance = 2;
}

message FundReply {
  phoenix.protobuf.DecimalValue balance = 1;
  string resp = 2;
}

message GameUrlReply {
  string game_url = 1;
}

message GameRecordReply {
  repeated GameRecordInfo items = 1;
}

message GameRecordInfo {
  string external_bet_id = 1;
  string player_code = 2;
  GameRecordState state = 3;
  bool is_cashout = 4;
  google.protobuf.Timestamp external_created_on = 5;
  google.protobuf.Timestamp external_closed_on = 6;
  google.protobuf.Timestamp external_payoff_on = 7;
  phoenix.protobuf.DecimalValue bet = 8;
  phoenix.protobuf.DecimalValue valid_bet = 9;
  phoenix.protobuf.DecimalValue settle = 10;
  phoenix.protobuf.DecimalValue win_loss = 11;
  string additional_data = 12;
}

message CheckingServiceReply{
  string machine_name = 1;
}

enum GameRecordState{
	/// <SUMMARY>
	/// THE WAITING
	/// 0=確認中
	/// </SUMMARY>
	GAME_RECORD_STATE_WAITING = 0;
	/// <SUMMARY>
	/// THE RUNNING
	/// 1=下單成功
	/// </SUMMARY>
	GAME_RECORD_STATE_RUNNING = 1;
	/// <SUMMARY>
	/// THE WIN
	/// 2=贏
	/// </SUMMARY>
	GAME_RECORD_STATE_WIN = 2;
	/// <SUMMARY>
	/// THE LOSS
	/// 3=輸
	/// </SUMMARY>
	GAME_RECORD_STATE_LOSS = 3;
	/// <SUMMARY>
	/// THE DRAW
	/// 4=和
	/// </SUMMARY>
	GAME_RECORD_STATE_DRAW = 4;
	/// <SUMMARY>
	/// THE CANCEL
	/// 5=取消
	/// </SUMMARY>
	GAME_RECORD_STATE_CANCEL = 5;
	/// <SUMMARY>
	/// THE CANCEL ORDER
	/// 6=撤單
	/// </SUMMARY>
	GAME_RECORD_STATE_CANCEL_ORDER = 6;
	/// <SUMMARY>
	/// THE FAILED ORDER
	/// 7=下單失敗
	/// </SUMMARY>
	GAME_RECORD_STATE_FAILED_ORDER = 7;
	/// <SUMMARY>
	/// THE VOID
	/// 8=作廢單
	/// </SUMMARY>
	GAME_RECORD_STATE_VOID = 8;
}
